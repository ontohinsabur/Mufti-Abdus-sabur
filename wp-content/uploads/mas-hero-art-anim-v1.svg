 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs><style>
.drw,.drw2,.drw3,.glw{stroke-dasharray:1;stroke-dashoffset:1;animation:d 5s ease-in-out infinite}
.drw2{animation-delay:.6s}.drw3{animation-delay:1.2s}
.glw{animation-name:g}
.hd,.hd2{opacity:0;transform-box:fill-box;transform-origin:100% 0;animation:h 5s ease-in-out infinite}
.hd2{animation-delay:.6s}
@keyframes d{0%{stroke-dashoffset:1;opacity:1}50%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes g{0%{stroke-dashoffset:1;opacity:0}50%{stroke-dashoffset:0;opacity:.3}70%{opacity:.75}88%{opacity:.3}100%{opacity:0}}
@keyframes h{0%,42%{opacity:0;transform:translate(-14px,14px) scale(.6)}52%,88%{opacity:1;transform:none}100%{opacity:0}}
.bars rect{transform-box:fill-box;transform-origin:50% 100%;animation:b 2.8s ease-in-out infinite alternate}
.bars rect:nth-child(2){animation-delay:.3s}.bars rect:nth-child(3){animation-delay:.6s}.bars rect:nth-child(4){animation-delay:.9s}
@keyframes b{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.tw circle{animation:t 2.4s ease-in-out infinite}.tw circle:nth-child(2){animation-delay:.6s}.tw circle:nth-child(3){animation-delay:1.2s}.tw circle:nth-child(4){animation-delay:1.8s}
@keyframes t{0%,100%{opacity:.25}50%{opacity:1}}
.dart{animation:a 3s ease-in-out infinite}
@keyframes a{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:inherit}.hd,.hd2{opacity:1}}
</style>
